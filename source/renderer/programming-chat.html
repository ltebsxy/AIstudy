<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self' data:; script-src 'self'"><title>编程 AI 问答</title><link rel="stylesheet" href="programming-chat.css"><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="ui-tokens.css"><link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="chat-layout.css"><script src="theme.js"></script><script src="chat-ui.js"></script></head>
<body><button id="ball" title="打开 AI 问答" aria-label="打开 AI 问答">✦</button>
<div id="panel" class="chat-panel"><header class="chat-header"><div class="brand-dot"></div><strong>AI 问答</strong><span id="course-title" class="chat-heading-context"></span><button id="collapse" title="收起为悬浮球" aria-label="收起 AI 问答">×</button></header>
<div class="chat-content"><div class="actions chat-tools"><button id="compact">压缩上下文</button><button id="clear-context">清除上下文</button></div><div id="messages" class="chat-messages" role="log" aria-label="编程问答消息"><button id="load-more" class="history-more" hidden>加载更早消息</button></div><div id="proposal"></div>
<div id="context-items"></div><p id="status" class="chat-status" role="status"></p><div class="chat-composer"><textarea id="question" rows="2" maxlength="2500" placeholder="输入你的问题…" aria-label="输入问题"></textarea><button id="ask" class="chat-send" aria-label="发送" title="发送"></button></div>
<footer class="chat-footer"><div class="chat-connection-row"><select id="ai-mode" aria-label="切换 AI 连接"></select><button id="screenshot">截图提问</button></div><div class="chat-extra-actions"><button id="propose">生成修改建议</button><button id="submit" title="保存文件后进入提交界面">提交作答</button></div></footer></div></div>
<script src="ai-connections.js"></script><script src="programming-chat.js"></script></body></html>
