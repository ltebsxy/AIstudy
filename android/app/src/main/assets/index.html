<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>AI-StudyDesk · 英语阅读</title><link rel="stylesheet" href="vendor/katex/katex.min.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="ui-tokens.css"><link rel="stylesheet" href="reader-ui.css"><script defer src="vendor/katex/katex.min.js"></script><script defer src="math.js"></script><script type="module" src="app.mjs"></script></head>
<body hidden>
<header><button id="back" aria-label="返回">‹</button><img src="vendor/icon.svg" alt=""><strong id="title">AI-StudyDesk</strong><span id="save-status" aria-live="polite"></span><button id="open-notes">笔记</button><button id="settings" aria-label="阅读设置">设置</button></header>
<main id="library" hidden><div class="library-heading"><small>ENGLISH READING</small><h1>英语阅读</h1><p class="hint">双击查词，长按选短语，离线阅读。</p></div><div class="library-tools"><button id="import-file">导入文章</button><button id="import-folder">导入文件夹</button><button id="new-folder">新建文件夹</button></div><div class="filters"><button id="folder-up">上一级</button><span id="folder-name">全部</span><select id="sort" aria-label="排序"><option value="order">导入顺序</option><option value="name">名称</option><option value="recent">最近阅读</option></select><button id="view" aria-label="切换列表或网格">列表 / 网格</button></div><div id="items"></div><p class="hint" id="empty"></p></main>
<main id="reader" hidden><div id="viewport"><div id="scroll"><div id="paper"><article id="content"></article></div></div></div></main>
<footer id="reader-tools" hidden><span id="phrase-bar">双击查词 · 长按选短语</span><button id="phrase-lookup">查询选区</button><span id="reading-progress" aria-label="阅读进度">0%</span></footer>
<aside id="translation" hidden role="dialog" aria-label="离线释义"><div class="dialog-head"><h3 id="translation-title"></h3><button id="translation-close" aria-label="关闭释义">×</button></div><div id="translation-content"></div><div id="translation-ai" hidden></div><p id="translation-status" role="status"></p><footer><small>ECDICT · MIT · 离线</small><div class="translation-actions"><button id="translate-ai" title="仅发送当前单词或短语">AI翻译</button><button id="add-note">加入笔记</button></div></footer></aside>
<div id="toast" hidden role="status"></div>
<dialog id="settings-dialog"><form method="dialog"><h2>阅读设置</h2><label>外观<select id="theme"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">夜间</option></select></label><label>正文字号<input id="font-size" type="range" min="15" max="30"></label><label>行距<input id="line-height" type="range" min="1.3" max="2.4" step="0.1"></label><p class="hint">字号和行距按文章保存，仅调整 TXT / Markdown 正文。普通查词使用本地词库，AI翻译仅在主动点击时发送所选词语。</p><button id="ai-settings" type="button">AI翻译设置</button><button id="licenses" type="button">许可与来源</button><button value="close">完成</button></form></dialog>
<dialog id="ai-config-dialog"><form id="ai-config-form"><h2>AI翻译设置</h2><label>HTTPS 接口完整地址<input name="endpoint" type="url" placeholder="https://…/v1/chat/completions" required></label><label>模型 ID<input name="model" required></label><label>API Key<input name="key" type="password" autocomplete="off" placeholder="留空保留已有密钥"></label><label><input name="clearKey" type="checkbox">清除已保存密钥</label><label>翻译提示词<textarea name="prompt" rows="3"></textarea></label><p class="hint">密钥由 Android Keystore 加密。AI翻译仅发送所选单词或短语，不附带全文、聊天历史或笔记。</p><button type="submit">保存</button><button type="button" data-close>关闭</button></form></dialog>
<dialog id="info-dialog"><h2 id="info-title"></h2><div id="info-content"></div><button data-close>关闭</button></dialog>
<input id="preview-import" type="file" hidden multiple>
</body></html>
