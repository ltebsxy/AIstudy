<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>AI-StudyDesk</title><link rel="stylesheet" href="vendor/katex/katex.min.css"><link rel="stylesheet" href="style.css"><script defer src="vendor/katex/katex.min.js"></script><script defer src="math.js"></script><script type="module" src="app.mjs"></script></head>
<body hidden>
<header><button id="back" aria-label="返回">‹</button><img src="vendor/icon.svg" alt=""><strong id="title">AI-StudyDesk</strong><span id="save-status" aria-live="polite"></span><button id="settings">设置</button></header>
<main id="library" hidden><nav class="tabs"><button data-mode="documents">读写</button><button data-mode="courses">课程</button></nav><div class="library-tools"><button id="import-file">导入文件</button><button id="import-folder">导入文件夹</button><button id="new-folder">新文件夹</button><button id="new-note">空白笔记</button></div><div class="filters"><button id="folder-up">上一级</button><span id="folder-name">全部</span><select id="sort" aria-label="排序"><option value="order">导入顺序</option><option value="name">名称</option><option value="recent">最近阅读</option></select><button id="view">列表 / 网格</button></div><div id="items"></div><p class="hint" id="empty"></p></main>
<main id="reader" hidden><div class="toolbar"><button data-tool="hand">阅读 / 滚动</button><button data-tool="pen">画笔</button><button data-tool="marker">荧光</button><button data-tool="eraser">橡皮</button><button id="undo" aria-label="撤销">↶</button><button id="redo" aria-label="重做">↷</button><input id="ink-color" type="color" value="#263c32" aria-label="笔色"><select id="ink-width" aria-label="笔粗"><option value="2.5">细</option><option value="4">中</option><option value="7">粗</option></select><button id="english">英语阅读</button><button id="read-settings">排版</button><button id="ai-open">AI</button></div><div id="phrase-bar" hidden><span>长按选词，拖动选择柄；双击选区查短语</span><button id="phrase-select">短语选择</button><button id="phrase-lookup">查询选区</button></div><div id="viewport"><div id="scroll"><div id="paper"><article id="content"></article><div id="extension"></div></div></div><canvas id="ink"></canvas></div><footer id="course-controls" hidden><button id="knowledge">知识点</button><button id="previous">上一题</button><span id="question-number"></span><button id="next">下一题</button><button id="submit">提交答案</button></footer></main>
<aside id="translation" hidden role="dialog" aria-label="离线释义"></aside><div id="toast" hidden role="status"></div>
<dialog id="settings-dialog"><form method="dialog"><h2>设置</h2><label>外观<select id="theme"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">夜间</option></select></label><label>正文字号<input id="font-size" type="range" min="15" max="30"></label><label>行距<input id="line-height" type="range" min="1.3" max="2.4" step="0.1"></label><p class="hint">排版按文档保存。调整正文排版后，原有手写批注的对应位置可能变化；笔记仍按原坐标保留。</p><button id="ai-settings" type="button">AI 设置</button><button id="licenses" type="button">许可与来源</button><button value="close">完成</button></form></dialog>
<dialog id="ai-config-dialog"><form id="ai-config-form"><h2>AI 设置</h2><label>HTTPS 接口完整地址<input name="endpoint" type="url" placeholder="https://…/v1/chat/completions" required></label><label>模型 ID<input name="model" required></label><label>API Key<input name="key" type="password" autocomplete="off" placeholder="留空保留已有密钥"></label><label><input name="clearKey" type="checkbox">清除已保存密钥</label><label>系统提示词<textarea name="prompt" rows="3"></textarea></label><p class="hint">密钥由 Android Keystore 加密。问答仅发送输入及主动附上的选区；普通查词完全离线。</p><button type="submit">保存</button><button type="button" data-close>关闭</button></form></dialog>
<dialog id="ai-dialog"><div class="dialog-head"><h2>AI 问答</h2><button data-close>关闭</button></div><div id="chat-history"></div><p id="ai-attachment" class="hint"></p><textarea id="chat-input" rows="3" placeholder="输入问题"></textarea><div class="actions"><button id="attach-selection">附上选区</button><button id="clear-context">清除上下文</button><button id="send-chat">发送</button></div></dialog>
<dialog id="answer-dialog"><h2>已提交作答</h2><div id="answer-content"></div><button id="grade">AI 批改本次提交</button><button data-close>关闭</button></dialog>
<dialog id="info-dialog"><h2 id="info-title"></h2><div id="info-content"></div><button data-close>关闭</button></dialog>
<input id="preview-import" type="file" hidden multiple>
</body></html>
